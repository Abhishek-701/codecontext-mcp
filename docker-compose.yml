services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codecontext
      POSTGRES_PASSWORD: codecontext
      POSTGRES_DB: codecontext
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecontext -d codecontext"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
